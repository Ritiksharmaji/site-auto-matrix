# Builds the website on every push to main and hands it to oneKampus, which
# publishes it at the site's address. Do not rename this file or the "site" artifact.
name: Deploy to oneKampus

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error
