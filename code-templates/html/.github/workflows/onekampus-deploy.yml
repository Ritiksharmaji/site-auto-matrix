# Publishes the website on every push to main. Do not rename this file or the "site" artifact.
name: Deploy to oneKampus

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the website files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' ./ _site/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
          if-no-files-found: error
