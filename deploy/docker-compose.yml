# Site Platform production stack (one small server):
#   caddy  — HTTPS for sites.onekampus.com, <slug>.onekampus.com and client custom domains
#   app    — Next.js (admin panel, client portal, every client website)
#   db     — PostgreSQL 17
# Secrets live in deploy/.env on the server (created by server-setup.sh, never committed).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siteplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site_platform
    # Small-server tuning (1 GB RAM shared with Node and Caddy).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteplatform -d site_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://siteplatform:${POSTGRES_PASSWORD}@db:5432/site_platform
      UPLOAD_DIR: /data/uploads
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - app
